services:
  postgres:
    # Pinned to a major on purpose: postgres:alpine now resolves to 18+, which
    # relocated its data directory and no longer accepts a mount at
    # /var/lib/postgresql/data. Unpinned tags also make the build irreproducible.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-httpsms}
      # No default on purpose. A checked-in database password is a leaked
      # database password, and this file is tracked in a public repository.
      # Generate one into a root .env (gitignored) and let compose interpolate.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the root .env}
      POSTGRES_USER: ${POSTGRES_USER:-httpsms}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    # Require password from root .env so the API (which has REDIS_URL with auth)
    # can actually authenticate. The base compose is dev-shaped but this makes
    # it safe for both local and prod.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the root .env}"]
    volumes:
      - redis:/var/lib/redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./api
    # Bound to loopback so a host-level reverse proxy can reach it while it
    # stays inaccessible from the internet. Safe for both dev and prod.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./api/.env

  web:
    build:
      context: ./web
    # Same reasoning as api.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  redis:
  postgres:
